<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测测你是守望先锋里的谁</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #1a1a1a; margin: 0; padding: 32px 16px; }
  button { font: inherit; }
  .btn { display: inline-block; border: 1px solid #d0d0d5; background: #fff; color: #1a1a1a; border-radius: 8px; padding: 8px 16px; min-height: 28px; cursor: pointer; }
  .btn:hover { border-color: #b0b0b8; }
  .btn-primary { background: #f99e1a; border-color: #f99e1a; color: #fff; font-weight: 500; }
  .btn-primary:hover { background: #e8930f; border-color: #e8930f; }
  .btn-lg { padding: 12px 32px; font-size: 17px; }
  .btn-block { display: block; width: 100%; margin-bottom: 8px; }
  .text-muted { color: #6e6e78; }
  .text-small { font-size: 13px; }
  .card { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .viz-badge { display: inline-block; background: #faf0dc; color: #9a6a10; border-radius: 999px; padding: 3px 12px; font-size: 13px; }
  .progress { background: #e9e9ee; border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-bar { background: #f99e1a; height: 100%; border-radius: 999px; transition: width .25s; }
  hr { border: 0; border-top: 1px solid #e5e5ea; margin: 16px 0; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="ow-quiz" style="max-width:680px;margin:0 auto;">
  <style>
    #ow-quiz .ow-opt { text-align: left; justify-content: flex-start; margin-bottom: 8px; }
    #ow-quiz .ow-hero-name { font-size: 1.5em; font-weight: 500; }
    #ow-quiz .ow-quote { font-style: italic; color: var(--muted-foreground, #6e6e78); margin: 8px 0 12px; }
    #ow-quiz .ow-desc { line-height: 1.7; }
    #ow-quiz .ow-roster { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 16px 0 20px; }
    #ow-quiz .ow-face { position: relative; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; background: var(--muted, #e9e9ee); border-radius: 8px; width: 40px; height: 40px; font-size: 20px; flex: none; }
    #ow-quiz .ow-face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #ow-quiz .ow-face.ow-portrait { width: 96px; height: 96px; border-radius: 16px; font-size: 48px; margin: 8px auto; }
    #ow-quiz .ow-face.ow-sm { width: 32px; height: 32px; border-radius: 6px; font-size: 16px; }
    #ow-quiz .ow-ult-label { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px; }
    #ow-quiz .ow-victory { text-align: center; letter-spacing: 6px; font-weight: 500; color: var(--primary, #f99e1a); margin-bottom: 12px; }
    #ow-quiz .ow-matches { margin: 12px auto 0; max-width: 360px; text-align: left; }
    #ow-quiz .ow-matches .ow-match { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    #ow-quiz .ow-match .ow-fit { margin-left: auto; color: var(--muted-foreground, #6e6e78); }
    #ow-quiz .ow-profile { text-align: center; margin: 4px 0 0; }
  </style>

  <!-- 开始页 -->
  <div id="ow-start" style="text-align:center;padding:24px 0;">
    <h2>测测你是守望先锋里的谁？</h2>
    <p class="text-muted" style="margin:8px 0 4px;">「这个世界需要更多英雄。」</p>
    <p class="text-muted" style="margin:0 0 4px;">基于每位英雄在官方剧情中的性格，我们从 8 个维度<br>（守护·独行 / 热血·冷静 / 张扬·内敛 / 守序·随性 / 助人·自强 /<br>幽默·严肃 / 好胜·佛系 / 科技·直觉）<br>将你与全部 <strong>54 位英雄</strong> 逐一比对，找出人格最接近的那一位。</p>
    <div class="ow-roster" id="ow-roster" aria-label="全部候选英雄"></div>
    <button type="button" class="btn btn-primary btn-lg" id="ow-begin">选择你的英雄</button>
  </div>

  <!-- 答题页 -->
  <div id="ow-quiz-page" hidden>
    <div class="ow-ult-label">
      <span class="text-muted" id="ow-progress-label">目标 1 / 30</span>
      <span class="text-muted tabular-nums" id="ow-charge">大招充能 0%</span>
    </div>
    <div class="progress" role="progressbar" aria-label="大招充能进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="margin:8px 0 20px;">
      <div class="progress-bar" id="ow-progress-bar" style="width:0%"></div>
    </div>
    <h3 id="ow-question" style="margin-bottom:16px;"></h3>
    <div id="ow-options" aria-live="polite"></div>
    <div style="margin-top:8px;"><button type="button" class="btn" id="ow-back" hidden>← 返回上一题</button></div>
    <hr>
    <p class="text-muted text-small" id="ow-tip" style="margin:0;"></p>
  </div>

  <!-- 结果页 -->
  <div id="ow-result" hidden aria-live="polite">
    <div class="ow-victory">胜利 · VICTORY</div>
    <div class="card" style="text-align:center;">
      <span class="text-muted text-small">全场最佳 · PLAY OF THE MATCH</span>
      <span class="ow-face ow-portrait"><span id="ow-r-emoji"></span><img id="ow-r-portrait" alt=""></span>
      <div class="ow-hero-name" id="ow-r-name"></div>
      <div style="margin-top:8px;"><span class="viz-badge" id="ow-r-role"></span></div>
      <p class="ow-quote" id="ow-r-quote"></p>
      <p class="ow-desc text-small" id="ow-r-desc"></p>
    </div>
    <p class="ow-profile text-small" id="ow-r-profile" aria-live="polite"></p>
    <p class="text-muted text-small" style="text-align:center;margin:16px 0 4px;">其他相近的英雄</p>
    <div class="ow-matches" id="ow-matches"></div>
    <p class="text-muted text-small" id="ow-r-tip" style="text-align:center;margin:12px 0 16px;"></p>
    <div style="text-align:center;">
      <button type="button" class="btn" id="ow-back-result">← 返回修改</button>
      <button type="button" class="btn" id="ow-retry">再来一局</button>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('ow-quiz');

    'https://cdn.jsdelivr.net/gh/hk0i/counters.to@master/packages/counters-web/static/images/heroes/',
    'https://fastly.jsdelivr.net/gh/hk0i/counters.to@master/packages/counters-web/static/images/heroes/',
    'https://gcore.jsdelivr.net/gh/hk0i/counters.to@master/packages/counters-web/static/images/heroes/'
  ];

  var heroes = {
    dva:            { name: 'D.Va', role: '坦克 · 王牌机师', emoji: '🎮', vec: [0, 1, 2, 0, 0, 2, 2, 1], quote: '这才叫专业玩家！', desc: '你自信张扬、好胜心强，把一切都当成值得赢下的比赛。享受舞台和掌声，也有拿得出手的实力。' },

    domina:         { name: 'Domina', role: '坦克 · 铁腕统治', emoji: '⚔️', vec: [0, 1, 2, -1, -1, -1, 2, 0], quote: '跪下，或者让开。', desc: '你气场慑人、控制欲强，天生就是发号施令的人，但强者也有守护柔软的一面。' },
    doomfist:       { name: '末日铁拳', role: '坦克 · 强权拳王', emoji: '👊', vec: [-1, -1, 1, -1, -2, -1, 2, 0], quote: '只有强者，才能定义未来。', desc: '你相信力量与进取，敢于All-in。你从不等待机会，而是亲手打出来。' },
    hazard:         { name: '哈泽德', role: '坦克 · 岩浆突袭', emoji: '🌋', vec: [-1, 2, 1, -2, 0, 2, 1, -1], quote: '没有什么能挡得住我。', desc: '你横冲直撞、无所畏惧，困难在你眼里只是待撞碎的墙。' },
    'junker-queen': { name: '渣客女王', role: '坦克 · 废土女王', emoji: '👑', vec: [0, 2, 2, -2, 1, 2, 2, -2], quote: '女王驾到，都让开！', desc: '你天生自带气场，糙汉子的幽默配上女王级的统治力，混世却讲义气。' },
    mauga:          { name: '毛加', role: '坦克 · 双枪狂人', emoji: '🔥', vec: [1, 2, 2, -1, 1, 2, 1, -1], quote: '火力全开，这才叫热闹！', desc: '你热爱热闹与力量，朋友越多越开心，胆子越大越尽兴。' },

    freja:          { name: '弗蕾娅', role: '输出 · 赏金猎人', emoji: '🏹', vec: [-1, -1, 0, 0, -1, 0, 1, 0], quote: '目标锁定，一击命中。', desc: '你独立精干、嗅觉敏锐，越是有挑战的目标越能激起你的兴致。' },

        { t: '拉TA出来一起嗨', s: { lucio: 3, juno: 2, kiriko: 2, dva: 1, mauga: 1 } },
        { t: '讲道理，帮TA把心结解开', s: { ana: 3, doctrine: 2, winston: 1, zenyatta: 1 } },
        { t: '默默多帮TA分担一点', s: { mercy: 3, brigitte: 2, lifeweaver: 2, baptiste: 1 } },
        { t: '尊重TA的空间，等TA自己好起来', s: { zenyatta: 3, moira: 2, wuyang: 1, illari: 1 } } ] },
    { q: '拿下关键一杀，你会？', opts: [
        { t: '喊出来/发信号，让全场知道', s: { tracer: 3, dva: 2, junkrat: 2, lucio: 1, mauga: 1 } },
        { t: '淡淡一笑，继续找下一个目标', s: { widowmaker: 3, ashe: 2, hanzo: 2, sojourn: 1, reaper: 1 } },
        { t: '第一时间看队友位置，找配合', s: { sombra: 3, echo: 2, genji: 1, cassidy: 1, baptiste: 1 } },
        { t: '摆个pose，仪式感必须有', s: { venture: 3, 'junker-queen': 2, kiriko: 2, 'wrecking-ball': 1 } } ] },
    { q: '接到一个全新任务，你的第一反应？', opts: [
        { t: '先查资料、研究清楚再动手', s: { winston: 3, symmetra: 2, echo: 2, emre: 2, moira: 1 } },
        { t: '边做边学，做着做着就会了', s: { tracer: 3, venture: 2, junkrat: 1, dva: 1, lucio: 1 } },
        { t: '找有经验的人请教', s: { brigitte: 3, kiriko: 2, juno: 2, dmon: 1, cassidy: 1 } },
        { t: '直接上，实践出真知', s: { doomfist: 3, hazard: 2, 'junker-queen': 1, reaper: 1, mauga: 1 } } ] },
    { q: '你的桌面/房间现状？', opts: [
        { t: '东西各归其位，看着就舒服', s: { symmetra: 3, 'soldier-76': 2, orisa: 2, sojourn: 1, torbjorn: 1, emre: 1 } },
        { t: '乱中有序，只有我找得到', s: { sombra: 3, hanzo: 2, echo: 1, moira: 1, sigma: 1, mei: 1 } },
        { t: '随缘吧，能用就行', s: { roadhog: 3, junkrat: 2, 'wrecking-ball': 2, hazard: 1, lucio: 1, 'jetpack-cat': 1 } },
        { t: '常整理但常乱', s: { tracer: 3, dva: 2, kiriko: 1, venture: 1, juno: 1 } } ] },
    { q: '被对手嘲讽了，你会？', opts: [
        { t: '用实力打脸，下一局见', s: { dva: 3, genji: 2, hanzo: 2, widowmaker: 2, sojourn: 1 } },
        { t: '嘲回去啊，嘴上不能输', s: { 'junker-queen': 3, mauga: 2, lucio: 2, junkrat: 1, sombra: 1 } },
        { t: '无视，赢了才是真的', s: { 'soldier-76': 3, ana: 2, winston: 2, mercy: 1, zenyatta: 1 } },
        { t: '笑一笑，游戏而已', s: { mei: 3, lifeweaver: 2, venture: 2, roadhog: 1, 'wrecking-ball': 1 } } ] },
    { q: '一直没进展的难题，你会？', opts: [
        { t: '换个思路，重新建模', s: { winston: 3, moira: 2, symmetra: 2, echo: 1, sigma: 1, emre: 1 } },
        { t: '死磕到底，不信攻不下来', s: { 'soldier-76': 3, zarya: 2, torbjorn: 2, pharah: 1, sojourn: 1 } },
        { t: '先放放，灵感会来的', s: { zenyatta: 3, lifeweaver: 2, mei: 2, wuyang: 1, shion: 1 } },
        { t: '找人一起头脑风暴', s: { lucio: 3, juno: 2, brigitte: 2, baptiste: 1, kiriko: 1 } } ] },
    { q: '看电影哭了，你会？', opts: [
        { t: '大大方方承认，好哭就是好哭', s: { mei: 3, mercy: 2, lifeweaver: 2, lucio: 1, juno: 1, mizuki: 1 } },
        { t: '默默擦掉，别被看见', s: { genji: 3, hanzo: 2, ana: 2, widowmaker: 1, 'soldier-76': 1, reaper: 1 } },
        { t: '用玩笑带过去', s: { lucio: 3, kiriko: 2, junkrat: 2, dva: 1, sombra: 1, venture: 1 } },
        { t: '本来就不太会哭', s: { doomfist: 3, ramattra: 2, orisa: 2, sigma: 1, moira: 1, bastion: 1 } } ] }
  ];

  function imgTag(key, cssClass) {
    var h = heroes[key];
    var cls = cssClass ? ' ' + cssClass : '';
    return '<span class="ow-face' + cls + '" title="' + h.name + '"><span>' + h.emoji + '</span><img src="' + (h.img || MIRRORS[0] + key + '.png') + '" data-key="' + key + '" data-m="0" alt="' + h.name + '" loading="lazy" onerror="window.owFallback(this)"></span>';
  }

  window.owFallback = function (img) {
    var key = img.getAttribute('data-key');
    var h = heroes[key] || {};
    var sources = [];
    for (var i = 0; i < MIRRORS.length; i++) sources.push(MIRRORS[i] + key + '.png');
    var m = parseInt(img.getAttribute('data-m') || '0', 10);
    if (m + 1 < sources.length) {
      img.setAttribute('data-m', String(m + 1));
      img.src = sources[m + 1];
    } else {
      img.style.display = 'none';
    }
  };

  var idx = 0, user = {}, answers = [];
  AXES.forEach(function (a) { user[a] = 0; });
  var mode = 'round1', baseRanked = [], tbQueue = [], tbIdx = 0, tbAnswers = [], bonus = {};
  var elStart = document.getElementById('ow-start');
  var elPage = document.getElementById('ow-quiz-page');
  var elResult = document.getElementById('ow-result');

  function pickTip(seed) {
    return tips[Math.abs(seed) % tips.length];
  }

  function show(page) {
    elStart.hidden = page !== 'start';
    elPage.hidden = page !== 'quiz';
    elResult.hidden = page !== 'result';
  }

  var roster = document.getElementById('ow-roster');
  roster.innerHTML = Object.keys(heroes).map(function (k) { return imgTag(k); }).join('');

  function renderQuestion() {
    var pct = Math.round((idx / questions.length) * 100);
    document.getElementById('ow-progress-label').textContent = '目标 ' + (idx + 1) + ' / ' + questions.length;
    document.getElementById('ow-charge').textContent = '大招充能 ' + pct + '%';
    var bar = document.getElementById('ow-progress-bar');
    bar.style.width = pct + '%';
    bar.parentElement.setAttribute('aria-valuenow', pct);
    document.getElementById('ow-question').textContent = questions[idx].q;
    document.getElementById('ow-tip').textContent = pickTip(idx);
    document.getElementById('ow-back').hidden = idx === 0;
    var box = document.getElementById('ow-options');
    box.innerHTML = '';
    questions[idx].opts.forEach(function (opt) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-block ow-opt';
      b.textContent = opt.t;
      b.addEventListener('click', function () { answer(opt.s); });
      box.appendChild(b);
    });
  }

  function recompute() {
    AXES.forEach(function (a) { user[a] = 0; });
    for (var i = 0; i < idx && i < answers.length; i++) {
      var d = answers[i];
      if (d) Object.keys(d).forEach(function (k) { user[k] += d[k]; });
    }
  }

  function answer(deltas) {
    answers[idx] = deltas;
    recompute();
    idx++;
    if (idx < questions.length) {
      renderQuestion();
    } else {
      startTiebreak();
    }
  }

  function goBack(target) {
    idx = target;
    recompute();
    renderQuestion();
    show('quiz');
  }

  function distTo(vec) {
    var d = 0;
    AXES.forEach(function (a, i) {
      var u = user[a] / maxPossible[a];
      var h = vec[i] / 2;
      d += (u - h) * (u - h);
    });
    return d;
  }

  function startTiebreak() {
    baseRanked = Object.keys(heroes).map(function (k) {
      return { key: k, d: distTo(heroes[k].vec) };
    }).sort(function (x, y) { return x.d - y.d; });
    var top5 = baseRanked.slice(0, 5).map(function (r) { return r.key; });
    tbQueue = tiebreaks.map(function (q) {
      var covered = {};
      q.opts.forEach(function (o) {
        Object.keys(o.s).forEach(function (k) { if (top5.indexOf(k) >= 0) covered[k] = 1; });
      });
      return { q: q, n: Object.keys(covered).length };
    }).sort(function (x, y) { return y.n - x.n; }).slice(0, 3).map(function (s) { return s.q; });
    tbIdx = 0;
    tbAnswers = [];
    recomputeBonus();
    mode = 'tiebreak';
    renderTiebreak();
    show('quiz');
  }

  function recomputeBonus() {
    bonus = {};
    for (var i = 0; i < tbIdx && i < tbAnswers.length; i++) {
      var d = tbAnswers[i];
      if (d) Object.keys(d).forEach(function (k) { bonus[k] = (bonus[k] || 0) + d[k]; });
    }
  }

  function renderTiebreak() {
    document.getElementById('ow-progress-label').textContent = '决胜局 ' + (tbIdx + 1) + ' / ' + tbQueue.length;
    document.getElementById('ow-charge').textContent = '大招充能 100%';
    var bar = document.getElementById('ow-progress-bar');
    bar.style.width = '100%';
    bar.parentElement.setAttribute('aria-valuenow', 100);
    document.getElementById('ow-question').textContent = tbQueue[tbIdx].q;
    document.getElementById('ow-tip').textContent = '决胜局：根据第一轮结果，从和你最像的几位英雄里挑出最接近的那位。';
    document.getElementById('ow-back').hidden = tbIdx === 0;
    var box = document.getElementById('ow-options');
    box.innerHTML = '';
    tbQueue[tbIdx].opts.forEach(function (opt) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-block ow-opt';
      b.textContent = opt.t;
      b.addEventListener('click', function () { answerTb(opt.s); });
      box.appendChild(b);
    });
  }

  function answerTb(deltas) {
    tbAnswers[tbIdx] = deltas;
    recomputeBonus();
    tbIdx++;
    if (tbIdx < tbQueue.length) {
      renderTiebreak();
    } else {
      renderResult();
    }
  }

  function renderResult() {
    var ranked = baseRanked.map(function (r) {
      return { key: r.key, d: Math.max(0, r.d - 0.02 * (bonus[r.key] || 0)) };
    }).sort(function (x, y) { return x.d - y.d; });
    var top = ranked[0];
    var tieGroup = ranked.filter(function (r) { return r.d === top.d; });
    var pick = tieGroup[Math.floor(Math.random() * tieGroup.length)];
    var hk = pick.key, topHero = heroes[hk];

    document.getElementById('ow-r-emoji').textContent = topHero.emoji;
    var portrait = document.getElementById('ow-r-portrait');
    portrait.setAttribute('data-key', hk);
    portrait.setAttribute('data-m', '0');
    portrait.onerror = function () { window.owFallback(this); };
    portrait.src = topHero.img || (MIRRORS[0] + hk + '.png');
    document.getElementById('ow-r-name').textContent = topHero.name;
    document.getElementById('ow-r-role').textContent = topHero.role;
    document.getElementById('ow-r-quote').textContent = topHero.quote;
    document.getElementById('ow-r-desc').textContent = topHero.desc;

    var scored = AXES.map(function (a) {
      return { a: a, n: user[a] / maxPossible[a] };
    }).sort(function (x, y) { return Math.abs(y.n) - Math.abs(x.n); });
    var labels = [];
    scored.forEach(function (s) {
      if (labels.length < 4 && Math.abs(s.n) >= 0.34) {
        labels.push(s.n > 0 ? TRAITS[s.a][0] : TRAITS[s.a][1]);
      }
    });
    document.getElementById('ow-r-profile').textContent = labels.length
      ? '你的人格画像：' + labels.join(' · ')
      : '你的人格画像：各方面相当均衡，像水一样百搭（这可不常见）。';

    var others = ranked.filter(function (r) { return r.key !== hk; }).slice(0, 3);
    var maxSim = 1 / (1 + pick.d);
    var matches = document.getElementById('ow-matches');
    matches.innerHTML = others.map(function (r) {
      var fit = Math.round(100 * (1 / (1 + r.d)) / maxSim);
      return '<div class="ow-match">' + imgTag(r.key, 'ow-sm') + '<span>' + heroes[r.key].name + '</span><span class="ow-fit tabular-nums">契合度 ' + fit + '%</span></div>';
    }).join('');

    document.getElementById('ow-r-tip').textContent = pickTip(hk.length + topHero.name.length);
    show('result');
  }

  function begin() {
    idx = 0;
    answers = [];
    recompute();
    mode = 'round1';
    tbQueue = [];
    tbAnswers = [];
    bonus = {};
    renderQuestion();
    show('quiz');
  }

  document.getElementById('ow-begin').addEventListener('click', begin);
  document.getElementById('ow-retry').addEventListener('click', begin);
  document.getElementById('ow-back').addEventListener('click', function () {
    if (mode === 'tiebreak') {
      if (tbIdx > 0) { tbIdx--; recomputeBonus(); renderTiebreak(); }
      else { mode = 'round1'; goBack(questions.length - 1); }
    } else if (idx > 0) {
      goBack(idx - 1);
    }
  });
  document.getElementById('ow-back-result').addEventListener('click', function () { goBack(questions.length - 1); });
})();
</script>
</body>
</html>
